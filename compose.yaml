# Stack completa da ufla-devops-shop: API + PostgreSQL + Redis + Nginx.
#
#   cp .env.example .env      # e troque a senha
#   docker compose up -d --wait
#
# So o nginx publica porta. Os outros servicos se enxergam pelo nome
# (banco, cache, api) na rede que o compose cria para o projeto.

services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/c-souzs/ufla-shop:1.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?defina no .env}@banco:5432/${POSTGRES_DB:?defina no .env}
      REDIS_URL: redis://cache:6379/0
    depends_on:
      banco:
        condition: service_healthy
      cache:
        condition: service_healthy
    # sem "ports": a API so e alcancada pelo nginx, dentro da rede do compose

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  dados-banco:
