services:
  banco:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}

    volumes:
      - dados-pg:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


  cache:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


  api:
    image: ghcr.io/thiagoferreira13/ufla-shop:1.0.0

    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
      REDIS_URL: redis://cache:6379

    depends_on:
      banco:
        condition: service_healthy
      cache:
        condition: service_healthy

    restart: unless-stopped


  nginx:
    image: nginx:1.27-alpine

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/ready"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


volumes:
  dados-pg:
