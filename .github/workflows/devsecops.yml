name: DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ufla-shop
  VERSION: 1.0.${{ github.run_number }}

jobs:
  tests:
    name: Tests and image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: 'pip install --only-binary=:all: -r requirements-ci.txt'

      - name: Run tests
        run: pytest --cov=app --cov-report=term

      - name: Build image
        run: docker build --tag "$IMAGE:$VERSION" --tag "$IMAGE:ci" .

      - name: Save image
        run: docker save "$IMAGE:ci" | gzip > image.tar.gz

      - name: Upload image for security scans
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-image
          path: image.tar.gz
          retention-days: 7

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: 'pip install --only-binary=:all: -r requirements-ci.txt'

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Enforce Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy:
    name: Trivy vulnerability scans
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: container-image

      - name: Load image
        run: docker load --input image.tar.gz

      - name: Pull Trivy scanner
        run: docker pull aquasec/trivy:0.56.1

      - name: Scan dependencies and image report
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            aquasec/trivy:0.56.1 fs --scanners vuln \
            --format json --output trivy-fs.json \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL /work
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.56.1 image --scanners vuln \
            --format json --output /work/trivy-image.json \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL "$IMAGE:ci"

      - name: Block fixable HIGH and CRITICAL dependency vulnerabilities
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            aquasec/trivy:0.56.1 fs --scanners vuln \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 /work

      - name: Block fixable HIGH and CRITICAL image vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.56.1 image --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$IMAGE:ci"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-reports
          path: trivy-*.json
          retention-days: 30

  sbom:
    name: SBOM
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Download image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: container-image

      - name: Load image
        run: docker load --input image.tar.gz

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE }}:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ufla-shop-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, gitleaks, sonarcloud, trivy, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}