# Proxy reverso da stack: a unica porta publicada (80) e esta.
# "api" e o nome do servico no compose.yaml; o DNS interno do Docker resolve.

# A API (FastAPI) so aceita GET nas rotas de leitura e responde 405 a HEAD
# (curl -I). O nginx repassa HEAD como GET e devolve so os cabecalhos ao cliente.
map $request_method $metodo_upstream {
    HEAD    GET;
    default $request_method;
}

server {
    listen 80;
    server_name _;

    # healthcheck do proprio nginx: nao depende da API
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://api:8000;
        proxy_method $metodo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
