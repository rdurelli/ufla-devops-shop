# nginx/loja.conf — proxy reverso com TLS para o ufla-devops-shop
#
# O certificado é gerado pelo deploy.sh (openssl req -x509) e fica em
# /etc/nginx/ssl/loja.{crt,key} — não é versionado (ver .gitignore).

# --------------------------------------------------------------------------
# HTTP (80) — apenas redireciona para HTTPS
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------------
# HTTPS (443) — proxy reverso para a API em 127.0.0.1:8000
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/loja.crt;
    ssl_certificate_key /etc/nginx/ssl/loja.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
