# loja.conf --- proxy reverso com TLS para o ufla-devops-shop.
#
# Instalado pelo deploy.sh em /etc/nginx/conf.d/loja.conf.
# O certificado e autoassinado e gerado na hora do deploy; nao vai para o
# repositorio (*.pem e *.key ja estao no .gitignore).
#
# A API continua ouvindo apenas em 127.0.0.1:8000 --- de fora, quem atende e
# o Nginx, e e ele que repassa o IP real do cliente.

# A aplicacao (FastAPI) responde GET mas nao implementa HEAD: qualquer HEAD
# devolve 405. Como o teste do enunciado e `curl -kI https://localhost`, e o
# -I manda HEAD, o Nginx recebe 405 da API e repassaria esse 405 ao cliente.
# Este map troca o metodo enviado para cima: HEAD vira GET no proxy, e o
# Nginx descarta o corpo ao devolver a resposta. O cliente ve 200.
map $request_method $metodo_upstream {
    default $request_method;
    HEAD    GET;
}

# ---------------------------------------------------------------- HTTP :80
# Nenhum conteudo aqui: tudo vira HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------- HTTPS :443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # HTTP/2 como diretiva propria (nginx >= 1.25). O deploy.sh apaga esta
    # linha em versoes mais antigas --- no 1.24, que e o do Ubuntu 24.04, ela
    # nao existe e o `nginx -t` recusa a configuracao inteira. Com HTTP/1.1
    # o teste do enunciado tambem passa.
    http2 on;

    ssl_certificate     /etc/nginx/ssl/loja.pem;
    ssl_certificate_key /etc/nginx/ssl/loja.key;

    # O certificado e autoassinado, entao estas duas linhas evitam ruido
    # desnecessario no log sem afrouxar o resto da configuracao.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/loja.access.log;
    error_log  /var/log/nginx/loja.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Usa o map do topo deste arquivo (HEAD -> GET).
        proxy_method $metodo_upstream;

        # Cabecalhos de IP real: sem eles a aplicacao ve todos os acessos
        # vindos de 127.0.0.1, e o access log perde o cliente de verdade.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
