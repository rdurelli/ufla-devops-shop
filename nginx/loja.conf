# ufla-devops-shop — proxy reverso com TLS (autoassinado).
# Instalado por scripts/deploy.sh em /etc/nginx/conf.d/loja.conf.
# A API continua ouvindo so em 127.0.0.1:8000; de fora, so o Nginx responde.

# HTTP: so redireciona para HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS: termina o TLS e repassa para a API.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ufla-shop.crt;
    ssl_certificate_key /etc/nginx/ssl/ufla-shop.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;
    }
}
